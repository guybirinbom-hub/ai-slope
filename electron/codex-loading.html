<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Wanderer's Codex — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #ede4ce;
    --ink-dim: #c3b69a;
    --ink-muted: #8a7e64;
    --ink-deep: #6b5e44;
    --gold: #c9a13b;
    --gold-bright: #e8c557;
    --gold-deep: #8a6f25;
    --crimson: #a83a25;
    --crimson-deep: #6f1f10;
    --bg: #15110b;
    --bg-2: #1c1710;
    --bg-3: #261e14;
    --bg-card: #211a11;
    --rule: rgba(201, 161, 59, 0.32);
    --rule-soft: rgba(201, 161, 59, 0.16);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-size: 15px;
    line-height: 1.4;
    overflow: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,161,59,0.06), transparent 70%),
      radial-gradient(ellipse 100% 50% at 50% 100%, rgba(168, 58, 37, 0.04), transparent 70%),
      repeating-linear-gradient(43deg, rgba(255,240,210,.012) 0 2px, transparent 2px 5px),
      repeating-linear-gradient(137deg, rgba(255,240,210,.010) 0 2px, transparent 2px 7px);
  }
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(circle at 50% 52%, rgba(201,161,59,.12) 0%, rgba(201,161,59,.04) 22%, transparent 55%);
  }

  .page { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: 26px 1fr auto auto; min-height: 0; }

  .winbar {
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: center;
    height: 26px;
    padding: 0 4px 0 14px;
    background: linear-gradient(180deg, #0e0a06 0%, #1a140c 100%);
    border-bottom: 1px solid var(--rule-soft);
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: .26em;
    color: var(--ink-muted);
    text-transform: uppercase;
    user-select: none;
    -webkit-app-region: drag;
  }
  .winbar .title { display: flex; align-items: center; gap: 8px; }
  .winbar .title .dot {
    width: 6px; height: 6px;
    background: var(--gold);
    box-shadow: 0 0 6px rgba(201,161,59,.55);
    border-radius: 50%;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 6px rgba(201,161,59,.55); opacity: 1; }
    50%      { box-shadow: 0 0 12px rgba(201,161,59,.85); opacity: .65; }
  }
  .winbar .title b { color: var(--gold); font-weight: 700; letter-spacing: .26em; }
  .winbar .center {
    text-align: center;
    font-style: italic;
    color: var(--ink-deep);
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: none;
  }
  .winbar .center b { color: var(--ink-dim); font-style: normal; font-weight: 600; }
  .winbtns { display: flex; align-items: stretch; gap: 0; -webkit-app-region: no-drag; }
  .winbtn {
    width: 38px; height: 26px;
    display: grid; place-items: center;
    color: var(--ink-muted);
  }
  .winbtn svg { width: 10px; height: 10px; }
  .winbtn svg path { stroke: currentColor; stroke-width: 1.4; fill: none; stroke-linecap: square; }

  .stage {
    position: relative;
    display: grid; place-items: center;
    min-height: 0;
    padding: 24px;
  }

  .corner {
    position: absolute;
    width: 92px; height: 92px;
    color: var(--gold);
    opacity: .45;
    pointer-events: none;
  }
  .corner.tl { top: 18px; left: 18px; }
  .corner.tr { top: 18px; right: 18px; transform: scaleX(-1); }
  .corner.bl { bottom: 18px; left: 18px; transform: scaleY(-1); }
  .corner.br { bottom: 18px; right: 18px; transform: scale(-1, -1); }
  .corner svg { width: 100%; height: 100%; display: block; }

  .motes { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .mote {
    position: absolute;
    width: 3px; height: 3px;
    background: var(--gold-bright);
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(232,197,87,.7), 0 0 14px rgba(201,161,59,.35);
    opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(40px) scale(.6); opacity: 0; }
    15%  { opacity: 1; }
    85%  { opacity: .9; }
    100% { transform: translateY(-460px) scale(1.1); opacity: 0; }
  }

  .seal-wrap {
    position: relative;
    width: 440px; height: 440px;
    display: grid; place-items: center;
  }
  .ring {
    position: absolute; inset: 0;
    display: grid; place-items: center;
  }
  .ring svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .ring.outer  { animation: spin 60s linear infinite; }
  .ring.middle { animation: spin 28s linear infinite reverse; }
  .ring.inner  { animation: spin 18s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .seal-core {
    position: relative;
    width: 168px; height: 168px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 32% 28%, #3a2d18 0%, #1a1208 60%, #0a0703 100%);
    box-shadow:
      0 0 0 1px var(--gold-deep),
      0 0 0 5px var(--bg),
      0 0 0 6px var(--rule-soft),
      0 0 40px rgba(201,161,59,.35),
      inset 0 0 30px rgba(0,0,0,.6);
    display: grid; place-items: center;
    z-index: 2;
  }
  .seal-core .crest-d20 {
    width: 140px; height: 140px;
    color: var(--gold-bright);
    filter:
      drop-shadow(0 0 18px rgba(232,197,87,.55))
      drop-shadow(0 2px 0 rgba(0,0,0,.6));
    transition: transform .12s ease;
  }
  .seal-core .crest-d20.rolling { animation: d20-roll 1.4s linear infinite; }
  /* Number is hidden ONLY while .rolling is on. The moment .rolling
     is removed (complete() removes it before adding .land), the
     number snaps to opacity 1 — explicit !important so neither the
     .land scale keyframe nor any future animation class accidentally
     inherits the rolling state's opacity:0. Before this !important
     guard, on a fast-cache load the user occasionally saw the dice
     land without ever revealing the rolled number. */
  .seal-core .crest-d20.rolling .num { opacity: 0; }
  .seal-core .crest-d20:not(.rolling) .num { opacity: 1 !important; }
  .seal-core .crest-d20.settled { animation: d20-settle 3s ease-in-out infinite; }
  .seal-core .crest-d20.land { animation: d20-land .42s cubic-bezier(.22,1.4,.36,1) 1; }
  .seal-core .crest-d20 svg { width: 100%; height: 100%; display: block; }
  .seal-core .crest-d20 .face-fill { fill: #1a1208; }
  .seal-core .crest-d20 .face-front { fill: rgba(201,161,59,.10); }
  .seal-core .crest-d20 .edge {
    stroke: currentColor; fill: none;
    stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round;
  }
  .seal-core .crest-d20 .edge.inner { stroke-width: 1.6; opacity: .85; }
  .seal-core .crest-d20 .face-front-line {
    stroke: currentColor; fill: none; stroke-width: 2; stroke-linejoin: round;
  }
  .seal-core .crest-d20 .num {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 22px;
    fill: currentColor;
    letter-spacing: 0;
    transition: font-size .18s ease, fill .25s ease;
  }
  .seal-core .crest-d20.land .num {
    font-size: 28px;
    fill: #fff7d6;
  }
  .seal-core .crest-d20.crit       .num { fill: var(--gold-bright); }
  .seal-core .crest-d20.fumble     .num { fill: #ff8a6a; }
  .seal-core .crest-d20.crit   .edge,
  .seal-core .crest-d20.crit   .edge.inner { stroke: var(--gold-bright); }
  .seal-core .crest-d20.fumble .edge,
  .seal-core .crest-d20.fumble .edge.inner { stroke: var(--crimson); }
  @keyframes d20-roll {
    0%   { transform: rotate(0deg);   filter: drop-shadow(0 0 20px rgba(232,197,87,.55)) drop-shadow(0 2px 0 rgba(0,0,0,.6)); }
    50%  {                            filter: drop-shadow(0 0 30px rgba(232,197,87,.80)) drop-shadow(0 0 60px rgba(201,161,59,.30)) drop-shadow(0 2px 0 rgba(0,0,0,.6)); }
    100% { transform: rotate(360deg); filter: drop-shadow(0 0 20px rgba(232,197,87,.55)) drop-shadow(0 2px 0 rgba(0,0,0,.6)); }
  }
  @keyframes d20-land {
    0%   { transform: rotate(0deg)  scale(1); }
    35%  { transform: rotate(0deg)  scale(1.22); filter: drop-shadow(0 0 38px rgba(232,197,87,.95)) drop-shadow(0 0 70px rgba(201,161,59,.5)) drop-shadow(0 2px 0 rgba(0,0,0,.6)); }
    65%  { transform: rotate(0deg)  scale(.96); }
    100% { transform: rotate(0deg)  scale(1);    filter: drop-shadow(0 0 22px rgba(232,197,87,.65)) drop-shadow(0 2px 0 rgba(0,0,0,.6)); }
  }
  @keyframes d20-settle {
    0%, 100% { transform: rotate(-2deg); filter: drop-shadow(0 0 18px rgba(232,197,87,.50)) drop-shadow(0 2px 0 rgba(0,0,0,.6)); }
    50%      { transform: rotate(2deg);  filter: drop-shadow(0 0 28px rgba(232,197,87,.80)) drop-shadow(0 0 50px rgba(201,161,59,.35)) drop-shadow(0 2px 0 rgba(0,0,0,.6)); }
  }

  .sweep {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    pointer-events: none;
  }
  .sweep svg { width: 100%; height: 100%; overflow: visible; }
  .sweep .arc-fill {
    fill: none;
    stroke: var(--gold-bright);
    stroke-width: 2;
    stroke-linecap: round;
    filter: drop-shadow(0 0 6px rgba(232,197,87,.7));
    stroke-dasharray: 1256.6;
    stroke-dashoffset: 1256.6;
    transition: stroke-dashoffset .35s ease;
  }
  .sweep .arc-track {
    fill: none;
    stroke: var(--rule-soft);
    stroke-width: 1;
    stroke-dasharray: 1 5;
  }

  .footer {
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 28px 16px;
    gap: 24px;
    z-index: 1;
  }
  .caption {
    text-align: center;
    grid-column: 2;
    min-width: 360px;
  }
  .caption .status {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--ink-dim);
    font-size: 16px;
    letter-spacing: .04em;
    height: 22px;
    line-height: 22px;
    position: relative;
  }
  .caption .status .line {
    position: absolute; left: 0; right: 0; top: 0;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .caption .status .line.on {
    opacity: 1;
    transform: translateY(0);
  }
  .caption .quill {
    color: var(--gold);
    margin-right: 6px;
    opacity: .8;
  }

  .progress-row {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 14px;
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: .28em;
    color: var(--ink-muted);
    text-transform: uppercase;
    padding: 0 4px;
    margin-top: 10px;
  }
  .progress-row .pct {
    color: var(--gold);
    font-size: 11px;
    letter-spacing: .14em;
    font-weight: 700;
    min-width: 42px;
    text-align: center;
  }
  .progress-row .rule-side {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--rule) 50%, transparent);
    position: relative;
  }
  .progress-row .rule-side::before, .progress-row .rule-side::after {
    content: '\2726';
    position: absolute;
    top: -7px;
    color: var(--gold-deep);
    font-size: 8px;
  }
  .progress-row .rule-side::before { left: 0; }
  .progress-row .rule-side::after  { right: 0; }

  .signoff {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 30px 14px;
    border-top: 1px solid var(--rule-soft);
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.35));
    pointer-events: none;
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--ink-deep);
    z-index: 1;
  }
  .signoff .v b { color: var(--ink-muted); font-weight: 700; }
  .signoff .quote {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 11px;
    letter-spacing: .08em;
    color: var(--ink-deep);
    text-transform: none;
  }
  .signoff .quote::before { content: '\201C'; color: var(--gold-deep); padding-right: 2px; }
  .signoff .quote::after  { content: '\201D'; color: var(--gold-deep); padding-left: 2px; }

  /* Error overlay — hidden by default; main.cjs flips
     #err-overlay visible on backend startup failure. The
     setStatus() IPC bridge writes the message into #err-msg.  */
  .err-overlay {
    position: fixed; inset: 0;
    background: rgba(13, 9, 5, 0.92);
    display: none;
    align-items: center; justify-content: center;
    z-index: 50;
    padding: 40px;
  }
  .err-overlay.on { display: flex; }
  .err-overlay .err-card {
    max-width: 720px;
    border: 1px solid var(--crimson);
    background: var(--bg-card);
    padding: 24px 28px;
    color: var(--ink);
    font-family: 'Cormorant Garamond', serif;
  }
  .err-overlay .err-title {
    font-family: 'Cinzel', serif; color: var(--crimson);
    font-size: 14px; letter-spacing: .28em; text-transform: uppercase;
    margin: 0 0 12px;
  }
  .err-overlay .err-msg {
    font-family: ui-monospace, monospace; font-size: 12px;
    color: var(--ink-dim); white-space: pre-wrap;
    max-height: 320px; overflow: auto;
  }
</style>
</head>
<body data-seal="compass">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="filigree" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round">
        <path d="M2 2 L60 2"/>
        <path d="M2 2 L2 60"/>
        <path d="M2 2 L18 18"/>
        <path d="M10 2 Q34 14 46 38 Q34 26 10 14 Z" stroke-width=".7" fill="currentColor" opacity=".25"/>
        <path d="M22 6 C 40 10, 58 24, 64 46"/>
        <path d="M6 22 C 10 40, 24 58, 46 64"/>
        <path d="M28 4 L34 10"/>
        <path d="M4 28 L10 34"/>
        <path d="M62 44 Q70 50 64 58 Q58 52 62 44 Z" fill="currentColor" stroke-width=".6"/>
        <path d="M50 50 L52 46 L54 50 L58 52 L54 54 L52 58 L50 54 L46 52 Z" fill="currentColor" stroke="none" opacity=".9"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="page">

  <div class="winbar">
    <div class="title">
      <span class="dot"></span>
      <span><b>Wanderer's Codex</b> &middot; Loading</span>
    </div>
    <div class="center">Opening the tome <b>&middot;</b> Local edition <b>&middot;</b> Whisper Elf <b>&middot;</b> Maestro Bard <b>&middot;</b> Level 5</div>
    <div class="winbtns">
      <div class="winbtn"><svg viewBox="0 0 10 10"><path d="M1 8 L9 8"/></svg></div>
      <div class="winbtn"><svg viewBox="0 0 10 10"><path d="M1 1 L9 1 L9 9 L1 9 Z"/></svg></div>
      <div class="winbtn"><svg viewBox="0 0 10 10"><path d="M1 1 L9 9 M9 1 L1 9"/></svg></div>
    </div>
  </div>

  <div class="stage">

    <div class="corner tl"><svg><use href="#filigree"/></svg></div>
    <div class="corner tr"><svg><use href="#filigree"/></svg></div>
    <div class="corner bl"><svg><use href="#filigree"/></svg></div>
    <div class="corner br"><svg><use href="#filigree"/></svg></div>

    <div class="motes" id="motes"></div>

    <div class="seal-wrap">

      <div class="ring outer">
        <svg viewBox="-220 -220 440 440">
          <circle cx="0" cy="0" r="210" fill="none" stroke="var(--rule)" stroke-width="1"/>
          <circle cx="0" cy="0" r="196" fill="none" stroke="var(--rule-soft)" stroke-width=".8" stroke-dasharray="2 4"/>
          <g class="tick-minor" stroke="var(--gold-deep)" stroke-width="1"></g>
          <g class="tick-major" stroke="var(--gold)" stroke-width="1.6"></g>
        </svg>
      </div>

      <div class="ring compass-extras outer" style="animation-duration:60s;">
        <svg viewBox="-220 -220 440 440">
          <g fill="var(--gold-deep)" opacity=".7">
            <path d="M124 -124 L132 -110 L116 -118 Z"/>
            <path d="M124 124  L116 110  L132 118 Z"/>
            <path d="M-124 124 L-116 110 L-132 118 Z"/>
            <path d="M-124 -124 L-132 -110 L-116 -118 Z"/>
          </g>
        </svg>
      </div>

      <div class="ring middle">
        <svg viewBox="-180 -180 360 360">
          <circle cx="0" cy="0" r="158" fill="none" stroke="var(--rule-soft)" stroke-width=".8"/>
          <circle cx="0" cy="0" r="148" fill="none" stroke="var(--rule-soft)" stroke-width=".5" stroke-dasharray="1 3"/>
          <g id="mid-diamonds"></g>
        </svg>
      </div>

      <div class="ring inner">
        <svg viewBox="-130 -130 260 260">
          <circle cx="0" cy="0" r="116" fill="none" stroke="var(--rule)" stroke-width=".9"/>
          <circle cx="0" cy="0" r="106" fill="none" stroke="var(--rule-soft)" stroke-width=".6"/>
          <g id="inner-dots"></g>
        </svg>
      </div>

      <div class="sweep">
        <svg viewBox="-220 -220 440 440">
          <circle cx="0" cy="0" r="200" class="arc-track" />
          <g transform="rotate(-90)">
            <circle cx="0" cy="0" r="200" class="arc-fill" id="arcFill"/>
          </g>
        </svg>
      </div>

      <div class="seal-core" id="seal-core">
        <div class="crest-d20 rolling" id="d20" aria-label="d20">
          <svg viewBox="-50 -54 100 108" aria-hidden="true">
            <polygon class="face-fill" points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23"/>
            <g class="edge inner">
              <line x1="0"   y1="-46" x2="0"   y2="-26"/>
              <line x1="40"  y1="-23" x2="0"   y2="-26"/>
              <line x1="40"  y1="-23" x2="22"  y2="12"/>
              <line x1="40"  y1="23"  x2="22"  y2="12"/>
              <line x1="0"   y1="46"  x2="22"  y2="12"/>
              <line x1="0"   y1="46"  x2="-22" y2="12"/>
              <line x1="-40" y1="23"  x2="-22" y2="12"/>
              <line x1="-40" y1="-23" x2="-22" y2="12"/>
              <line x1="-40" y1="-23" x2="0"   y2="-26"/>
            </g>
            <polygon class="face-front" points="0,-26 22,12 -22,12"/>
            <polygon class="face-front-line" points="0,-26 22,12 -22,12"/>
            <polygon class="edge" points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23"/>
            <text class="num" id="d20Num" x="0" y="5" text-anchor="middle">20</text>
          </svg>
        </div>
      </div>

    </div>

  </div>

  <div class="footer">
    <div class="caption">
      <div class="status" id="status">
        <span class="line on"><span class="quill">&#x2712;</span>Unsealing the codex&hellip;</span>
      </div>
    </div>
    <div class="progress-row">
      <div class="rule-side"></div>
      <div class="pct" id="pct">0%</div>
      <div class="rule-side"></div>
    </div>
  </div>

  <div class="signoff">
    <div class="v">Wanderer's Codex <b>v 1.4.2</b></div>
    <div class="quote">Knowledge bound, adventure unbound.</div>
    <div class="v" style="text-align:right;">Local <b>&middot;</b> Synced</div>
  </div>

</div>

<div class="err-overlay" id="err-overlay">
  <div class="err-card">
    <div class="err-title">The codex is sealed shut.</div>
    <div class="err-msg" id="err-msg"></div>
  </div>
</div>

<script>
  // Ring decorations + motes + status rotation + d20 roll/lock.
  (function() {
    const NS = 'http://www.w3.org/2000/svg';

    // Outer ring ticks (48; major every 6)
    const outer = document.querySelector('.ring.outer svg');
    const minor = outer.querySelector('.tick-minor');
    const major = outer.querySelector('.tick-major');
    for (let i = 0; i < 48; i++) {
      const angle = (i / 48) * Math.PI * 2;
      const isMajor = i % 6 === 0;
      const r1 = 196;
      const r2 = isMajor ? 184 : 190;
      const x1 = Math.cos(angle) * r1, y1 = Math.sin(angle) * r1;
      const x2 = Math.cos(angle) * r2, y2 = Math.sin(angle) * r2;
      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      (isMajor ? major : minor).appendChild(line);
    }

    // Middle ring diamonds
    const midD = document.getElementById('mid-diamonds');
    for (let i = 0; i < 16; i++) {
      const angle = (i / 16) * Math.PI * 2 + Math.PI / 16;
      const r = 148;
      const cx = Math.cos(angle) * r, cy = Math.sin(angle) * r;
      const isMajor = i % 4 === 0;
      const size = isMajor ? 5 : 3;
      const dia = document.createElementNS(NS, 'path');
      dia.setAttribute('d', 'M' + cx + ' ' + (cy - size) + ' L' + (cx + size) + ' ' + cy + ' L' + cx + ' ' + (cy + size) + ' L' + (cx - size) + ' ' + cy + ' Z');
      dia.setAttribute('fill', isMajor ? 'var(--gold)' : 'var(--gold-deep)');
      dia.setAttribute('opacity', isMajor ? '.95' : '.6');
      midD.appendChild(dia);
    }

    // Inner ring dots
    const innerD = document.getElementById('inner-dots');
    for (let i = 0; i < 36; i++) {
      const angle = (i / 36) * Math.PI * 2;
      const r = 106;
      const cx = Math.cos(angle) * r, cy = Math.sin(angle) * r;
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', cx); c.setAttribute('cy', cy);
      c.setAttribute('r', i % 3 === 0 ? 1.6 : 1);
      c.setAttribute('fill', i % 3 === 0 ? 'var(--gold)' : 'var(--gold-deep)');
      c.setAttribute('opacity', i % 3 === 0 ? '.9' : '.45');
      innerD.appendChild(c);
    }

    // Drifting motes
    const wrap = document.getElementById('motes');
    const N = 18;
    for (let i = 0; i < N; i++) {
      const m = document.createElement('div');
      m.className = 'mote';
      const left = 8 + Math.random() * 84;
      const dur  = 6 + Math.random() * 7;
      const delay = -Math.random() * dur;
      const size = 2 + Math.random() * 3;
      m.style.left = left + '%';
      m.style.bottom = '0';
      m.style.width = size + 'px';
      m.style.height = size + 'px';
      m.style.animationDuration = dur.toFixed(2) + 's';
      m.style.animationDelay = delay.toFixed(2) + 's';
      m.style.opacity = (0.5 + Math.random() * 0.5).toFixed(2);
      wrap.appendChild(m);
    }
  })();

  // Rotating status copy. Cycles independently of real backend
  // progress — purely flavour text. Real errors are surfaced via the
  // .err-overlay below.
  var STATUS_LINES = [
    'Unsealing the codex…',
    'Inscribing the page…',
    'Consulting the bestiary…',
    'Tuning the bardic strings…',
    'Polishing the rapier…',
    'Counting hero points…',
    'Cross-referencing Pathfinder canon…',
    'Whispering to the spell list…',
    'The page is nearly turned.'
  ];
  (function() {
    var status = document.getElementById('status');
    var idx = 0;
    function show(i) {
      var old = status.querySelector('.line.on');
      var next = document.createElement('span');
      next.className = 'line';
      next.innerHTML = '<span class="quill">✒</span>' + STATUS_LINES[i];
      status.appendChild(next);
      requestAnimationFrame(function() {
        next.classList.add('on');
        if (old) {
          old.classList.remove('on');
          setTimeout(function() { old.remove(); }, 600);
        }
      });
    }
    setInterval(function() {
      idx = (idx + 1) % STATUS_LINES.length;
      show(idx);
    }, 1800);
  })();

  // Progress arc + d20 roll/lock — driven by REAL parent signals.
  //
  // Previous version self-cycled every 8 seconds: dice rolled, locked
  // at 7s, restarted at 8s. Visible failure mode: if the underlying
  // load took >8s the dice landed-then-rerolled repeatedly, which the
  // user (correctly) said felt broken.
  //
  // New behaviour:
  //   - Dice keeps rolling indefinitely while we wait.
  //   - Percentage is set explicitly by the parent: Electron main.cjs
  //     pings window.codexProgress(n) at each boot stage; React's
  //     BackendReadyGate sends postMessage 'codex-progress' frames.
  //     If no signal arrives we slowly drift up to 95% so the bar
  //     still feels alive on a slow first-boot.
  //   - When the parent calls window.codexComplete() (or posts
  //     'codex-complete'), we jump to 100% and trigger the dice land.
  //     This is the LAST animation the user sees before the real app
  //     renders.
  (function() {
    var arc      = document.getElementById('arcFill');
    var pctEl    = document.getElementById('pct');
    var d20      = document.getElementById('d20');
    var numEl    = document.getElementById('d20Num');
    var C        = 1256.6;

    var target   = 1 + Math.floor(Math.random() * 20);
    var locked   = false;
    var current  = 0;   // displayed percentage, smoothly interpolated
    var goal     = 0;   // target percentage (parent-driven or drift)
    var lastDrift = performance.now();

    function setProgress(p) {
      var clamped = Math.max(0, Math.min(100, +p || 0));
      // Consumers that forget to call codex-complete and instead just
      // ramp progress to 100 used to hang the loader at "99 %":
      // current → 100 only asymptotically under the easing, and
      // Math.floor(99.95) shows 99 forever. Treat any progress at
      // 100 as a complete signal so the dice locks + the bar hits
      // 100 cleanly. (CharacterSheetPage relies on this when content
      // EXECUTE_OPS takes longer than the percentage ramp.)
      if (clamped >= 100 && !locked) {
        complete();
        return;
      }
      goal = clamped;
    }

    function complete() {
      if (locked) return;
      goal = 100;
      // Snap the displayed progress to 100% immediately when the
      // dice locks. Without this, the easing in the animation loop
      // takes ~3 seconds of exponential approach to converge from
      // 26% → 100% — but main.cjs only waits 700ms before swapping
      // to APP_URL, so the user would see "19 · 99%" instead of
      // "19 · 100%" and feel like the load finished before the bar
      // did. The d20 lock and the 100% should hit together.
      current = 100;
      locked = true;
      // Order matters: set the number FIRST so it's painted before
      // we remove the .rolling class (which un-hides .num via CSS).
      // Otherwise the user sees a one-frame flash of "20" (the initial
      // text content) before the rolled value appears.
      numEl.textContent = target;
      d20.classList.remove('rolling', 'settled');
      if      (target === 20) d20.classList.add('crit');
      else if (target === 1)  d20.classList.add('fumble');
      d20.classList.add('land');
      d20.addEventListener('animationend', function onLand(e) {
        if (e.animationName !== 'd20-land') return;
        d20.removeEventListener('animationend', onLand);
        d20.classList.remove('land');
        d20.classList.add('settled');
      });
    }

    // Expose direct API so an Electron parent can call via
    // webContents.executeJavaScript without postMessage hoops.
    window.codexProgress = setProgress;
    window.codexComplete = complete;

    // PostMessage bridge for React (BackendReadyGate iframe). Same
    // API; { type: 'codex-progress', value: 50 } or
    // { type: 'codex-complete' }.
    window.addEventListener('message', function(ev) {
      var d = ev.data;
      if (!d || typeof d !== 'object') return;
      if (d.type === 'codex-progress') setProgress(d.value);
      else if (d.type === 'codex-complete') complete();
    });

    function frame(now) {
      // If no parent signal in 600ms, gently drift up so the bar isn't
      // frozen at 0%. Caps at 95% so we always leave headroom for the
      // real "complete" jump to 100%.
      var sinceDrift = now - lastDrift;
      if (!locked && sinceDrift > 600 && goal < 95) {
        goal = Math.min(95, goal + 1.5);
        lastDrift = now;
      }
      // Smooth ease-in on current → goal so the bar doesn't pop.
      current += (goal - current) * 0.12;
      if (Math.abs(goal - current) < 0.05) current = goal;
      var shown = Math.floor(current);
      pctEl.textContent = shown + '%';
      arc.style.strokeDashoffset = (C * (1 - current / 100)).toFixed(1);
      requestAnimationFrame(frame);
    }
    d20.classList.add('rolling');
    requestAnimationFrame(frame);
  })();
</script>

</body>
</html>
