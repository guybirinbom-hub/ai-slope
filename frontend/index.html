<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <meta name="theme-color" content="#141517" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="author" content="Quzzar" />
    <link rel="apple-touch-icon" sizes="180X180" href="./public/apple-icon-180.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta
      name="keywords"
      content="pathfinder, starfinder, ttrpg, aon 2e, rpg, character, dnd, dungeons and dragons, pf2e, sf2e, aon, aon2e, archives of nethys"
    />
    <meta
      name="description"
      content="A character builder and digital toolbox for Pathfinder and Starfinder Second Edition."
    />

    <title>Wanderer's Guide</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&family=Ubuntu+Mono&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic-regular.min.css" rel="stylesheet" />
    <!-- Codex theme fonts (Cinzel + Cormorant Garamond + IM Fell English SC).
         Loaded here so the parchment/codex aesthetic is available globally
         from first paint, not just after the React bundle parses. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IM+Fell+English+SC&display=swap"
      rel="stylesheet"
    />
    <!-- wg4 redesign fonts — parchment palette uses Geist (sans),
         Newsreader italic (serif headings/prose), Geist Mono (numbers). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,14..32,400;1,14..32,500&display=swap"
      rel="stylesheet"
    />
    <!-- wg4 theme — apply the stored dark-mode class before first paint so
         there's no flash of the light theme on load. Mirrors utils/theme.ts. -->
    <script>
      try {
        if (localStorage.getItem('wg4-theme') === 'dark') {
          document.documentElement.classList.add('theme-dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
